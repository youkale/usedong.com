<header class="header">
  <div class="container">
    <nav class="nav">
      <div class="nav-left">
        <a href="{{ .Site.BaseURL }}" class="nav-logo">
          <span class="terminal-icon">{{ .Site.Title }}</span>
        </a>
      </div>

      <div class="nav-center">
        <ul class="nav-menu">
          {{ range .Site.Menus.main }}
          <li class="nav-item">
            <a href="{{ .URL }}" class="nav-link{{ if eq $.RelPermalink .URL }} active{{ end }}">
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      </div>

      <div class="nav-right">
        <button class="search-btn" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>

        {{ if .Site.Params.avatar }}
        <a href="/about" class="avatar-link">
          <img src="{{ .Site.Params.avatar | absURL }}" alt="Avatar" class="avatar">
        </a>
        {{ end }}

        <button class="mobile-menu-toggle" aria-label="Toggle menu">
          <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </button>
      </div>
    </nav>
  </div>
</header>

<!-- Mobile Menu -->
<div class="mobile-menu">
  <ul class="mobile-nav-menu">
    {{ range .Site.Menus.main }}
    <li class="mobile-nav-item">
      <a href="{{ .URL }}" class="mobile-nav-link">{{ .Name }}</a>
    </li>
    {{ end }}
  </ul>
</div>
