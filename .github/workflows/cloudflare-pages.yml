name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master  # 或者你的主分支名称
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果使用了 Git submodules（主题）
          fetch-depth: 0         # 获取完整历史，Hugo 需要

      - name: 🔧 Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true  # 如果使用 Hugo Extended 版本

      - name: 🔨 Build
        run: hugo --minify --gc

      - name: 🚀 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ykl-blog  # 你的 Cloudflare Pages 项目名称
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: master
